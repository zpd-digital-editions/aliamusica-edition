    <text x="30" y="52">diff</text>
    <path id="p2" d="M 70 60 A 20 20 0 0 1 110 60"/>
    <text dy="-4" textLength="50" lengthAdjust="spacing">
        <textPath xlink:href="#p2" startOffset="50%">TRIPLI</textPath>
    </text>
    <text x="90" y="52">diff</text>
    <!-- 1. Reihe -->
    <rect x="10" y="60" width="20" height="20"/>
    <text x="20" y="70">II</text>
    <rect x="30" y="60" width="20" height="20"/>
    <text x="40" y="70">IIII</text>
    <rect x="70" y="60" width="20" height="20"/>
    <text x="80" y="70">II</text>
    <rect x="90" y="60" width="20" height="20"/>
    <text x="100" y="70">VI</text>
    <!-- 2. Reihe -->
