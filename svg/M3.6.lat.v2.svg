<?xml version="1.0" encoding="UTF-8"?>
<?xml-stylesheet type="text/css" href="diagram.css"?>
<svg width="120" height="140" viewBox="-5 -10 130 155" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
