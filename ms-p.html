  	<!-- container for TEI document -->
    <div id="TEI"></div>
  	<!-- rendition -->
  	<script>
		/* query */
		filename = ( QueryString.doc == null )
			? ( "ms-p-apparatus.xml" )
			: ( QueryString.doc + ".xml" );
  		/* CETEIcean */
		var CETEIcean = new CETEI()
			CETEIcean.addBehaviors({
				"tei":{
					"teiHeader": null
				}
			});
			CETEIcean.getHTML5("tei/"+filename, function(data) {
			document.getElementById("TEI").appendChild(data)
		})
    </script>
